<html>
    <style>
        body {
            background-color: #212728;
            color: limegreen;
            padding: 2rem;
        }
        input,
        textarea {
            display: block;
            margin-bottom: 0.5rem;
            min-width: 15rem;
        }
        textarea {
            min-height: 200px;
        }
    </style>
    <body>
        <h2>04_autorize</h2>

        <input id="btn_autorize" type="button" value="autorize" />
        <input id="btn_logout" type="button" value="logout" />
        <input id="send" type="button" value="send data" />
        <textarea id="status" value="..."></textarea>

        <script type="module">
            import { Request } from './../../client/Request.js';
            import { Session } from './../../client/Session.js';
            const request = new Request();
            const session = new Session(request);

            const $btn_autorize = document.getElementById('btn_autorize');
            const $btn_logout = document.getElementById('btn_logout');
            const $send = document.getElementById('send');
            const $status = document.getElementById('status');

            function msg(str) {
                $status.value += ($status.value ? '\n' : '') + `${str}`;
                $status.scrollTop = $status.scrollHeight;
            }

            function autorize() {
                session
                    .autorizeByLogin('1', '1')
                    .then((o) => {
                        msg('autorize :ok.');
                        console.log(o);
                    })
                    .catch((e) => {
                        msg('autorize :error!');
                        console.log(e);
                    });
            }

            function logout() {
                msg('logout');
                session.logout();
            }

            function send() {
                request
                    .send({
                        
                        to: 'ajax/handler',
                        data: { text: 'test3' },
                    })
                    .then((o) => {
                        msg(o.data[0]);
                        console.log(o);
                    })
                    .catch((e) => {
                        console.log(e);
                    });
            }

            session
                .autorizeByToken()
                .then((o) => {
                    msg('auto autorize :ok.');
                    console.log(o);
                })
                .catch((e) => {
                    msg('auto autorize :error!');
                    console.log(e);

                });
            
            session.on('autorize',()=>{
                console.log('on autorize')
            })
            session.on('logout',()=>{
                console.log('on logout')
            })

            $btn_autorize.addEventListener('click', autorize);
            $btn_logout.addEventListener('click', logout);
            $send.addEventListener('click', send);
        </script>
    </body>
</html>
