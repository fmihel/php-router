<html>
<style>
    body {
        background-color: #212728;
        color: limegreen;
        padding: 2rem;
    }

    a {
        color: limegreen;
    }

    input,
    textarea {
        display: block;
        margin-bottom: 0.5rem;
        min-width: 15rem;
    }

    textarea {
        min-height: 200px;
    }

    hr {
        color: rgba(177, 133, 133, 0);
        border-color: rgb(95, 95, 95);
        background-color: rgba(0, 0, 0, 0);
    }

    pre {
        color: white;
        margin: 0;
        margin-bottom: 1rem;
        padding: 0;
        border: 1px solid rgb(95, 95, 95);
        background-color: #151717;

    }
</style>

<body>
    <h2><a id="link-root" href="..">examples<a> / 06_generateKey</h2>
    
    <textarea id="key" value="..."></textarea>
    <input id="generate_64" type="button" value="generate base64" />
    <input id="generate_hex" type="button" value="generate hex" />

    <script type="importmap">
        {
            "imports": {
                "libsodium": "https://cdn.jsdelivr.net/npm/libsodium@0.8.4/dist/modules-esm/libsodium.mjs",
                "libsodium-wrappers": "https://cdn.jsdelivr.net/npm/libsodium-wrappers@0.8.4/dist/modules-esm/libsodium-wrappers.mjs"
            }
        }
    </script>

    <script type="module">
        import { generateKey } from './../../client/utils/generateKey.js';


        const $btn64 = document.getElementById('generate_64');
        const $btnHex = document.getElementById('generate_hex');
        const $key = document.getElementById('key');


        $btn64.addEventListener('click', ()=>{
            $key.value = generateKey(true);
        });
        $btnHex.addEventListener('click', ()=>{
            $key.value = generateKey();
        });
    </script>
</body>

</html>
