<html>
<style>
    body {
        background-color: #212728;
        color: limegreen;
        padding: 2rem;
    }

    a {
        color: limegreen;
    }
</style>

<body>
    <h2><a id="link-root" href="..">examples<a> / 01_simple</h2>
    <input id="send" type="button" value="post.." />
    <input id="get" type="button" value="get.." />
    <input id="get2" type="button" value="get2.." />

    <script type="module">
        import { Request } from './../../client/Request.js';
        const request = new Request();

        const $post = document.getElementById('send');
        const $get = document.getElementById('get');
        const $get2 = document.getElementById('get2');
        const $linkRoot = document.getElementById('link-root');
        $linkRoot.href = window.location.origin + '/examples.html';

        $post.addEventListener('click',function(){
            request
                .send({
                    url:window.location.origin+'/examples/01_simple/router.php',
                    to: 'post',
                    attrs:{
                        PP:10
                    },
                    data: "string",
                })
                .then((o) => {
                    console.log(o);
                });
        });
        
        $get.addEventListener('click', function()  {
            request
                .get({
                    url:window.location.origin+'/examples/01_simple/router.php',
                    to: 'get_1',
                    attrs: { text: 'test2' },
                })
                .then((o) => {
                    console.log(o);
                });
        });
        $get2.addEventListener('click', function()  {
            request
                .get({
                    url:window.location.origin+'/examples/01_simple/router.php',
                    to:'get_2',
                    attrs: { text: {obj:'1',arr:[2,5,6]} },
                })
                .then((o) => {
                    console.log(o);
                });
        });
    </script>
</body>

</html>
